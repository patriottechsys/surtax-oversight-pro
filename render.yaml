databases:
  - name: surtax-oversight-db
    plan: free
    databaseName: surtax_pro
    user: surtax

services:
  - type: web
    name: surtax-oversight-pro
    runtime: python
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surtax-oversight-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # ANTHROPIC_API_KEY: value comes from Key Vault secret Demo-Apps-Share-API-Key (kv-demo-apps-shared); set it in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.6
